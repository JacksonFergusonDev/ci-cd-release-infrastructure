name: Update Homebrew Tap (Local Manifest)

on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag (e.g., v1.0.0)'
        required: true
        type: string
      formula_path:
        description: 'Relative path to the formula in the tap (optional, defaults to Formula/<package_name>.rb)'
        required: false
        type: string
        default: ''
    secrets:
      TAP_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  sync-homebrew:
    name: Sync Formula & Python Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out Caller Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: caller-repo
          persist-credentials: false

      - name: Check out Homebrew Tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacksonFergusonDev/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap
          persist-credentials: false

      - name: Check out Tooling Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacksonFergusonDev/ci-cd-release-infrastructure
          path: tooling-repo
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # main

      - name: Tap the repository
        run: brew tap JacksonFergusonDev/homebrew-tap ./homebrew-tap

      - name: Trust the tap
        run: brew trust JacksonFergusonDev/tap

      - name: Update Formula
        id: update
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          FORMULA_PATH: ${{ inputs.formula_path }}
        run: |
          ARGS=(--repo "$REPOSITORY" --tag "$TAG" --caller-dir "caller-repo" --tap-dir "homebrew-tap")
          if [ -n "$FORMULA_PATH" ]; then
            ARGS+=(--formula "$FORMULA_PATH")
          fi
          uv run tooling-repo/scripts/update_homebrew_local.py "${ARGS[@]}"

      - name: Commit and Push
        working-directory: homebrew-tap
        env:
          TAG: ${{ inputs.tag }}
          FORMULA_PATH: ${{ steps.update.outputs.formula_path }}
          PACKAGE_NAME: ${{ steps.update.outputs.package_name }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA_PATH"

          if git diff --cached --quiet; then
            echo "No formula changes to commit."
            exit 0
          fi

          cp "$FORMULA_PATH" "$(brew --repository jacksonfergusondev/homebrew-tap)/Formula/"

          brew audit --strict --online "jacksonfergusondev/homebrew-tap/$PACKAGE_NAME"
          git commit -m "chore: bump $PACKAGE_NAME to $TAG and sync python resources"

          # Credentials are not persisted by checkout; supply them only for the push.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH_HEADER"
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push
