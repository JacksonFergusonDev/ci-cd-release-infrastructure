name: Update Homebrew Tap (Local Manifest)

on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag (e.g., v1.0.0)'
        required: true
        type: string
      formula_path:
        description: 'Relative path to the formula in the tap (optional, defaults to Formula/<package_name>.rb)'
        required: false
        type: string
        default: ''
    secrets:
      TAP_GITHUB_TOKEN:
        required: true

jobs:
  sync-homebrew:
    name: Sync Formula & Python Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out Caller Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: caller-repo

      - name: Check out Homebrew Tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacksonFergusonDev/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Check out Tooling Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacksonFergusonDev/ci-cd-release-infrastructure
          path: tooling-repo

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@75658cea3fff530c0185eb566632a8ee1d03d752 # main

      - name: Tap the repository
        run: brew tap JacksonFergusonDev/homebrew-tap ./homebrew-tap

      - name: Trust the tap
        run: brew trust JacksonFergusonDev/tap

      - name: Update Formula
        id: update
        run: |
          ARGS=(--repo "${{ github.repository }}" --tag "${{ inputs.tag }}" --caller-dir "caller-repo" --tap-dir "homebrew-tap")
          if [ -n "${{ inputs.formula_path }}" ]; then
            ARGS+=(--formula "${{ inputs.formula_path }}")
          fi
          uv run tooling-repo/scripts/update_homebrew_local.py "${ARGS[@]}"

      - name: Commit and Push
        working-directory: homebrew-tap
        run: |
          FORMULA_PATH="${{ steps.update.outputs.formula_path }}"
          PACKAGE_NAME="${{ steps.update.outputs.package_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA_PATH"

          if git diff --cached --quiet; then
            echo "No formula changes to commit."
            exit 0
          fi

          cp "$FORMULA_PATH" "$(brew --repository jacksonfergusondev/homebrew-tap)/Formula/"

          brew audit --strict --online "jacksonfergusondev/homebrew-tap/$PACKAGE_NAME"
          git commit -m "chore: bump $PACKAGE_NAME to ${{ inputs.tag }} and sync python resources"
          git push
