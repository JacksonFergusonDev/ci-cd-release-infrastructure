name: Update Homebrew Tap (Local Manifest)

on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag (e.g., v1.0.0)'
        required: true
        type: string
      formula_path:
        description: 'Relative path to the formula in the tap (optional, defaults to Formula/<package_name>.rb)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Run every step including brew audit, but skip the commit and push to the tap'
        required: false
        type: boolean
        default: false
    secrets:
      TAP_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  sync-homebrew:
    name: Sync Formula & Python Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out Caller Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The formula's resources come from this checkout's uv.lock, so it
          # must be the released commit, not whatever ref started the run.
          ref: ${{ inputs.tag }}
          path: caller-repo
          persist-credentials: false

      - name: Check out Homebrew Tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacksonFergusonDev/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Tap and trust the checked-out tap
        run: |
          brew tap JacksonFergusonDev/tap ./homebrew-tap
          brew trust JacksonFergusonDev/tap

      - name: Update Formula
        id: update
        uses: $/.github/actions/update-formula-local
        with:
          repository: ${{ github.repository }}
          tag: ${{ inputs.tag }}
          formula_path: ${{ inputs.formula_path }}
          caller_dir: caller-repo
          tap_dir: homebrew-tap

      - name: Audit Formula
        env:
          FORMULA_PATH: ${{ steps.update.outputs.formula_path }}
          FORMULA_NAME: ${{ steps.update.outputs.formula_name }}
        run: |
          # `brew tap` cloned the checkout; audit the updated file from Homebrew's copy.
          TAPPED_FORMULA="$(brew --repository JacksonFergusonDev/tap)/$FORMULA_PATH"
          mkdir -p "$(dirname "$TAPPED_FORMULA")"
          cp "homebrew-tap/$FORMULA_PATH" "$TAPPED_FORMULA"
          brew audit --strict --online "JacksonFergusonDev/tap/$FORMULA_NAME"

      - name: Commit and Push
        working-directory: homebrew-tap
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORMULA_PATH: ${{ steps.update.outputs.formula_path }}
          FORMULA_NAME: ${{ steps.update.outputs.formula_name }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA_PATH"

          if git diff --cached --quiet; then
            echo "No formula changes to commit."
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "### Dry run: commit and push skipped"
              echo
              echo '```diff'
              git diff --cached
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git diff --cached --stat
            echo "::notice::Dry run: formula audited; commit and push skipped."
            exit 0
          fi

          git commit -m "chore: bump $FORMULA_NAME to $TAG and sync python resources"

          # Credentials are not persisted by checkout; supply them only for the push.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH_HEADER"
          authed_git() { git -c "http.https://github.com/.extraheader=$AUTH_HEADER" "$@"; }

          # Another release may have pushed to the tap meanwhile; rebase and retry.
          for attempt in 1 2 3; do
            if authed_git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/3); rebasing onto the latest tap."
            authed_git pull --rebase
          done
          echo "::error::Could not push to the tap after 3 attempts."
          exit 1
